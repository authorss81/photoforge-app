name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: 3.44.8
  JAVA_VERSION: 17

jobs:
  verify:
    name: analyze + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Format check
        run: dart format --output=none --set-exit-if-changed lib test test_golden integration_test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Native syntax
        # A duplicated Kotlin handler and a stray Swift brace both reached main
        # and only surfaced in the android and ios jobs, minutes and macOS
        # minutes later. This catches that class of error in seconds. It is a
        # balance check, not a compile, so it is not a substitute for the
        # android and ios jobs.
        run: python scripts/check_native_syntax.py

  golden:
    name: golden
    needs: verify
    # Linux only. Goldens live in test_golden/ (not test/) so a plain
    # `flutter test` never picks them up, and they are generated on Linux by
    # golden-generate.yml, because font rasterization differs per OS.
    # Verifying them anywhere else rejects files that are correct.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get

      - name: Check goldens are committed
        # Goldens are committed on purpose: CI must fail on a diff rather than
        # regenerate, which is the entire value of the job. This check exists
        # only to turn a confusing "golden file not found" from inside the test
        # runner into an actionable message.
        run: |
          set -euo pipefail
          if [ -z "$(find test_golden/goldens -name '*.png' 2>/dev/null)" ]; then
            echo "::error::No golden images committed."
            echo "Run the golden-generate workflow, inspect every image, then"
            echo "commit the result to test_golden/goldens/."
            exit 1
          fi
          ls -la test_golden/goldens/

      - name: Verify goldens
        # matchesGoldenFile already names the failing file and writes the actual
        # image next to the expected one, which is what makes the diff
        # actionable. No --update-goldens here, ever.
        run: flutter test test_golden/ --reporter expanded

  android:
    name: android
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get

      - name: Provide signing key
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [ -n "${RELEASE_KEYSTORE_B64:-}" ]; then
            echo "using the release keystore from secrets"
            echo "$RELEASE_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            STORE="$RUNNER_TEMP/release.keystore"
            STOREPASS='${{ secrets.KEYSTORE_PASSWORD }}'
            KEYALIAS='${{ secrets.KEY_ALIAS }}'
            KEYPASS='${{ secrets.KEY_PASSWORD }}'
          else
            echo "no release keystore secret; generating a throwaway CI key"
            echo "this proves the pipeline, not the product; never publish it"
            keytool -genkeypair -v -keystore "$RUNNER_TEMP/ci.keystore" \
              -alias ci -keyalg RSA -keysize 2048 -validity 2 \
              -storepass android -keypass android \
              -dname "CN=PixelForge CI, OU=CI, O=PixelForge, L=CI, S=CI, C=US" \
              -noprompt
            STORE="$RUNNER_TEMP/ci.keystore"
            STOREPASS='android'
            KEYALIAS='ci'
            KEYPASS='android'
          fi
          cat > android/key.properties <<EOF
          storeFile=$STORE
          storePassword=$STOREPASS
          keyAlias=$KEYALIAS
          keyPassword=$KEYPASS
          EOF
          echo "key.properties written (values masked in logs)"

      - name: Verify release signing config
        run: |
          set -euo pipefail
          cd android
          ./gradlew :app:verifyReleaseSigning --offline || ./gradlew :app:verifyReleaseSigning

      - name: Build universal release APK
        run: flutter build apk --release

      - name: Build split-per-ABI release APKs
        run: flutter build apk --release --split-per-abi

      - name: Build Play Store bundle
        run: flutter build appbundle --release

      - name: Prove the release APK asks for no permissions
        # Uses aapt from the Android SDK that the Gradle build just populated.
        run: |
          set -euo pipefail
          AAPT=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)aapt2
          "$AAPT" dump permissions build/app/outputs/flutter-apk/app-release.apk \
            | tee apk-permissions.txt
          if grep -q 'android.permission.INTERNET' apk-permissions.txt; then
            echo "::error::release APK requests INTERNET; the offline guarantee is broken"
            exit 1
          fi
          echo "No INTERNET permission in the release APK."

      - uses: actions/upload-artifact@v4
        with:
          name: pixelforge-android
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 30

  smoke:
    name: smoke
    needs: verify
    # A build that compiles is not a build that runs. This launches the app on
    # an emulator and drives one image through the whole pipeline, asserting the
    # output dimensions rather than merely asserting no crash.
    #
    # Kept on linux-latest with the KVM group and hardware acceleration enabled,
    # which is what makes an ARM emulator bootable in a reasonable time. Without
    # that this job is slow enough that people disable it, and a disabled smoke
    # test is worse than none because it still looks like coverage.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # Flutter must be on PATH before the emulator starts. The emulator action
      # runs its script through /usr/bin/sh in a way that does not inherit the
      # PATH this step adds, so the version is installed globally rather than
      # into a directory that step alone knows about.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The runner image ships an adb that has never been started, and the
      # emulator action's first adb call fails with "unable to connect to adb
      # daemon on port 5037". Starting it here, after KVM is set up and before
      # the emulator boots, avoids the collision. ANDROID_SDK_ROOT is set
      # explicitly because the action resolves the SDK through it.
      - name: Prepare adb
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_HOME }}
        run: |
          adb kill-server || true
          adb start-server
          adb devices

      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          # Interactive graphics. Without it the emulator defaults to a mode
          # where the display never updates, and every screenshot and find.text
          # fails against a black screen even though the app is fine.
          # Hardware acceleration is what makes the emulator boot in a sane
          # time, and the KVM step above is what enables it. SwiftShader is
          # deliberately not used: it is roughly fifty times slower and would
          # make this job unusable.
          emulator-options: -no-snapshot-save -no-boot-anim
          emulator-boot-timeout: 600
          script: |
            cd "$GITHUB_WORKSPACE"
            flutter --version
            flutter pub get
            # integration_test drives the real app on a real device; a widget
            # test cannot, because it never launches the platform.
            flutter test integration_test/app_test.dart \
              --dart-define=PIXELFORGE_SMOKE=1

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: smoke-logs
          path: |
            integration_test_output.txt
            build/
          retention-days: 7

  windows:
    name: windows
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get

      - name: Prove HEIC decoding works
        # The bundled libheif lives in windows/libheif in the source tree, but
        # Windows only resolves a DLL's own dependencies via the app directory,
        # System32 and PATH. Adding it to PATH here makes the test exercise the
        # real FFI decode rather than the fallback path.
        run: |
          $env:PATH = "windows\libheif;$env:PATH"
          flutter test test/resize_test.dart --plain-name "libheif decodes"
        shell: pwsh

      - name: Build Windows release
        run: flutter build windows --release

      - name: Zip the bundle
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath pixelforge-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: pixelforge-windows-x64
          path: pixelforge-windows-x64.zip
          if-no-files-found: error
          retention-days: 30

  benchmark:
    name: benchmark
    needs: verify
    # Informational only. It takes tens of minutes and must never block a merge.
    # Copy its table into benchmark/README.md when it produces new numbers.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get

      - name: Run benchmark matrix
        run: flutter test benchmark/ 2>&1 | tee benchmark-output.txt

      - uses: actions/upload-artifact@v4
        with:
          name: pixelforge-benchmark
          path: benchmark-output.txt
          if-no-files-found: error
          retention-days: 30

  ios:
    name: ios
    needs: verify
    # macos runners cost 10x linux minutes, so this runs on main pushes only,
    # never on pull requests.
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get

      - name: Build iOS without codesigning
        run: flutter build ios --no-codesign

  release:
    name: release
    needs: [android, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Collect release assets
        run: |
          mkdir -p assets
          find dist -name '*.apk'  -exec cp {} assets/ \;
          find dist -name '*.aab'  -exec cp {} assets/ \;
          find dist -name '*.zip' -exec cp {} assets/ \;
          ls -la assets

      - uses: softprops/action-gh-release@v2
        with:
          files: assets/*
          draft: true
          generate_release_notes: true
